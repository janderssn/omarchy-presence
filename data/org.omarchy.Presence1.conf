<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may be the presence service. -->
  <policy user="root">
    <allow own="org.omarchy.Presence1"/>
  </policy>

  <!-- Anyone may read it: it has properties and change signals, no methods
       of its own. -->
  <policy context="default">
    <allow send_destination="org.omarchy.Presence1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.omarchy.Presence1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.omarchy.Presence1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
